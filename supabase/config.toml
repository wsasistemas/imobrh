# Configuração local do Supabase CLI do ImobRH (WSA Sistemas).
#
# ATENÇÃO: o projeto remoto (ikvjaowvpvxojvcfwnct) é COMPARTILHADO com o imobdesk e os outros sistemas da WSA.
# Nunca rode `supabase config push` nem `supabase db push` a partir daqui: sobrescreveria Auth/API de todos.
# As migrations (supabase/migrations) vão pelo SQL Editor. Este arquivo existe só para o deploy das Edge Functions:
#   $env:SUPABASE_ACCESS_TOKEN = "<token da conta WSA>"
#   npx supabase functions deploy <nome> --project-ref ikvjaowvpvxojvcfwnct --use-api
# Variáveis das funções (Edge Functions › Secrets): RM_MODO = mock | real.
project_id = "wsa-imobrh"

# Todas exigem JWT válido; a função ainda confere o usuário, a sessão do gateway imobdesk-auth e a permissão
# (a chave anon também é um JWT). rm-token aceita também a service role (chamada entre funções).
[functions.rh-me]
verify_jwt = true

[functions.rm-token]
verify_jwt = true

[functions.rm-funcionario]
verify_jwt = true

[functions.rm-hierarquia]
verify_jwt = true

[functions.rm-consultas]
verify_jwt = true
